name: Candidate checks
on:
  push:
    branches:
      - 'feature/**'
      - 'test/**'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and smoke assertions
        run: node --test tests/smoke.test.cjs
